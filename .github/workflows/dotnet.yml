name: .NET

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ${{ matrix.operating-system }}

    strategy:
      fail-fast: false
      matrix:
        operating-system: [ubuntu-latest, windows-latest]

    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: |
          8.0.x
          10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test (.NET 8)
      run: dotnet test --no-build --verbosity normal --framework net8.0
    - name: Test (.NET 10)
      run: dotnet test --no-build --verbosity normal --framework net10.0
    # Exercises the netstandard2.0 build the way .NET Framework customers load it.
    - name: Test (.NET Framework 4.8)
      if: runner.os == 'Windows'
      run: dotnet test --no-build --verbosity normal --framework net48
